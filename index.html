<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phú Quý Travel - Royal Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* --- THAY ĐỔI LỚN NHẤT Ở ĐÂY --- */
        body {
            /* Nền Gradient Xanh Đậm: Từ Xanh Hải Quân -> Đen Huyền Bí */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            /* Hoặc nếu thích xanh tươi hơn thì dùng dòng dưới này (bỏ comment): */
            /* background: linear-gradient(135deg, #000428, #004e92); */
            
            background-attachment: fixed; /* Giữ nền đứng yên khi cuộn */
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* Menu bên trái cũng chuyển sang tông xanh trong suốt */
        .sidebar {
            height: 100vh; width: 260px; position: fixed; top: 0; left: 0;
            background: rgba(0, 30, 60, 0.4); /* Xanh kính mờ */
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
            padding-top: 30px; z-index: 1000;
        }

        .sidebar-brand {
            text-align: center; font-weight: 800; font-size: 24px; margin-bottom: 40px;
            color: #fff; text-shadow: 0 0 15px #00d2ff; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px;
            margin-left: 20px; margin-right: 20px;
        }

        .sidebar a {
            padding: 15px 25px; margin: 8px 15px; border-radius: 12px;
            text-decoration: none; font-size: 16px; color: rgba(255, 255, 255, 0.85);
            display: flex; align-items: center; cursor: pointer;
            transition: all 0.3s ease; border: 1px solid transparent;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.1); color: #fff;
            border: 1px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); transform: translateX(5px);
        }

        /* Nút đang chọn: Xanh sáng rực rỡ */
        .sidebar a.active {
            background: linear-gradient(90deg, rgba(0, 100, 255, 0.6), rgba(0, 200, 255, 0.4));
            color: #fff; font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); border: none;
        }

        .sidebar i { margin-right: 12px; font-size: 1.3rem; }
        .main-content { margin-left: 260px; height: 100vh; background: transparent; }
        #content-frame { width: 100%; height: 100%; border: none; }

        @media screen and (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; height: calc(100vh - 65px); }
            .mobile-nav {
                position: fixed; bottom: 0; width: 100%; height: 65px;
                background: rgba(0, 30, 60, 0.9);
                backdrop-filter: blur(10px);
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                display: flex; justify-content: space-around; align-items: center; z-index: 1000;
            }
            .mobile-nav-item { text-align: center; font-size: 11px; color: #ccc; width: 25%; text-decoration: none; }
            .mobile-nav-item i { font-size: 22px; display: block; margin-bottom: 3px; }
            .mobile-nav-item.active { color: #00d2ff; font-weight: bold; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        }
        @media screen and (min-width: 769px) { .mobile-nav { display: none; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="bi bi-gem"></i> PHÚ QUÝ PRO</div>
        <a onclick="loadPage('gioithieu.html', this)" class="menu-link active"><i class="bi bi-house-door-fill"></i> Trang Chủ</a>
        <a onclick="loadPage('bando.html', this)" class="menu-link"><i class="bi bi-map-fill"></i> Bản Đồ Số</a>
        <a onclick="loadPage('lichtau.html', this)" class="menu-link"><i class="bi bi-ticket-perforated-fill"></i> Lịch Tàu</a>
        <a onclick="loadPage('thoitiet.html', this)" class="menu-link"><i class="bi bi-cloud-sun-fill"></i> Thời Tiết</a>
    </div>

    <div class="main-content">
        <iframe id="content-frame" src="gioithieu.html" name="content-frame"></iframe>
    </div>

    <div class="mobile-nav">
        <a onclick="loadPage('gioithieu.html', this)" class="mobile-nav-item active"><i class="bi bi-house-door"></i> Home</a>
        <a onclick="loadPage('bando.html', this)" class="mobile-nav-item"><i class="bi bi-map"></i> Bản Đồ</a>
        <a onclick="loadPage('lichtau.html', this)" class="mobile-nav-item"><i class="bi bi-ferry"></i> Tàu</a>
        <a onclick="loadPage('thoitiet.html', this)" class="mobile-nav-item"><i class="bi bi-cloud-sun"></i> Thời Tiết</a>
    </div>

    <script>
        function loadPage(url, element) {
            document.getElementById('content-frame').src = url;
            document.querySelectorAll('a').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
            let links = document.querySelectorAll(`a[onclick*="${url}"]`);
            links.forEach(l => l.classList.add('active'));
        }
    </script>
</body>
</html>
