<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đảo Phú Quý - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Nền Xanh Hoàng Gia */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-attachment: fixed; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white;
        }

        /* Sidebar Kính */
        .sidebar {
            height: 100vh; width: 260px; position: fixed; top: 0; left: 0;
            background: rgba(0, 30, 60, 0.6); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column; /* Xếp dọc: Logo ở trên, Menu ở dưới */
            z-index: 1000;
        }

        /* --- 1. PHẦN LOGO NHỎ GỌN (Header) --- */
        .sidebar-brand {
            /* Xếp ngang Logo và Chữ */
            display: flex; align-items: center; 
            padding: 20px 15px; /* Thu gọn khoảng cách */
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.1); /* Nền hơi tối chút cho nổi bật */
            flex-shrink: 0; /* Không cho phép co lại */
        }
        
        .logo-img {
            width: 45px; height: 45px; /* Kích thước nhỏ gọn */
            object-fit: cover; border-radius: 50%;
            border: 2px solid #00d2ff; 
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-right: 12px; /* Khoảng cách với chữ */
            background: white; padding: 1px;
        }

        .brand-info { display: flex; flex-direction: column; }
        
        .brand-title {
            font-weight: 800; font-size: 16px; color: #fff; 
            text-transform: uppercase; letter-spacing: 0.5px;
            text-shadow: 0 0 5px #00d2ff; line-height: 1.2;
        }
        .brand-subtitle {
            font-size: 10px; color: #81d4fa; font-weight: 300; opacity: 0.9;
        }

        /* --- 2. PHẦN MENU (Có thanh cuộn) --- */
        .sidebar-menu {
            flex-grow: 1; /* Chiếm toàn bộ khoảng trống còn lại */
            overflow-y: auto; /* Tự động hiện thanh cuộn nếu dài quá */
            padding-top: 10px; padding-bottom: 20px;
        }

        /* Tùy chỉnh thanh cuộn cho đẹp (Webkit) */
        .sidebar-menu::-webkit-scrollbar { width: 5px; }
        .sidebar-menu::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.3); border-radius: 10px; }

        /* Style cho từng Link */
        .sidebar a {
            padding: 12px 20px; margin: 4px 10px; border-radius: 8px;
            text-decoration: none; font-size: 14px; color: rgba(255, 255, 255, 0.85);
            display: flex; align-items: center; cursor: pointer;
            transition: all 0.2s ease; border: 1px solid transparent;
        }
        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.1); color: #fff;
            border-color: rgba(0, 210, 255, 0.3); transform: translateX(3px);
        }
        .sidebar a.active {
            background: linear-gradient(90deg, rgba(0, 100, 255, 0.6), rgba(0, 200, 255, 0.4));
            color: #fff; font-weight: bold; border: none; box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
        }
        .sidebar i { margin-right: 12px; font-size: 1.1rem; width: 20px; text-align: center; }
        
        /* CONTENT & MOBILE */
        .main-content { margin-left: 260px; height: 100vh; background: transparent; }
        #content-frame { width: 100%; height: 100%; border: none; }

        @media screen and (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; height: calc(100vh - 65px); }
            .mobile-nav {
                position: fixed; bottom: 0; width: 100%; height: 65px;
                background: rgba(0, 30, 60, 0.95); backdrop-filter: blur(10px);
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                display: flex; justify-content: space-between; align-items: center; z-index: 1000;
                overflow-x: auto; padding: 0 10px;
            }
            .mobile-nav-item { 
                text-align: center; font-size: 9px; color: #aaa; text-decoration: none; 
                min-width: 65px; padding: 5px 0;
            }
            .mobile-nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }
            .mobile-nav-item.active { color: #00d2ff; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="https://scontent.fdad3-6.fna.fbcdn.net/v/t1.6435-9/142956966_3529262923853758_2950612826128762626_n.png?stp=dst-jpg_tt6&_nc_cat=110&ccb=1-7&_nc_sid=127cfc&_nc_ohc=9_x_fUx_okIQ7kNvwHWEl45&_nc_oc=AdmFJhAhMr9mBtLmzeKqd35HNmUfc23eeoosHvlw_Df5NweWBhH7s8U0vzAcVB5MN0K2h5jLc2WTMJHzArCX7yYx&_nc_zt=23&_nc_ht=scontent.fdad3-6.fna&_nc_gid=_cwb4XInUT3K2AQ6DGYfbw&oh=00_AfoBPh0fWgg7T245epyff0M1eeDmbTZh4rbmXZUxtD6-Rg&oe=69A1A44A" 
                 class="logo-img" alt="Logo">
            
            <div class="brand-info">
                <span class="brand-title">ĐẢO PHÚ QUÝ</span>
                <span class="brand-subtitle">Đặc khu Phú Quý, Lâm Đồng</span>
            </div>
        </div>
        
        <div class="sidebar-menu">
            <a onclick="loadPage('gioithieu.html', this)" class="menu-link active"><i class="bi bi-grid-fill"></i> Trang Chủ</a>
            <a onclick="loadPage('about.html', this)" class="menu-link"><i class="bi bi-info-circle-fill"></i> Giới Thiệu</a>
            <a onclick="loadPage('tintuc.html', this)" class="menu-link"><i class="bi bi-newspaper"></i> Tin Tức</a>
            <a onclick="loadPage('diadiem.html', this)" class="menu-link"><i class="bi bi-geo-alt-fill"></i> Điểm Đến</a>
            <a onclick="loadPage('luutru.html', this)" class="menu-link"><i class="bi bi-house-heart-fill"></i> Lưu Trú</a>
            <a onclick="loadPage('bando.html', this)" class="menu-link"><i class="bi bi-map-fill"></i> Bản Đồ Số</a>
            <a onclick="loadPage('lichtau.html', this)" class="menu-link"><i class="bi bi-ticket-perforated-fill"></i> Lịch Tàu</a>
            <a onclick="loadPage('thoitiet.html', this)" class="menu-link"><i class="bi bi-cloud-sun-fill"></i> Thời Tiết</a>
            <div style="height: 50px;"></div> 
        </div>
    </div>

    <div class="main-content">
        <iframe id="content-frame" src="gioithieu.html" name="content-frame"></iframe>
    </div>

    <div class="mobile-nav">
        <a onclick="loadPage('gioithieu.html', this)" class="mobile-nav-item active"><i class="bi bi-grid"></i> Home</a>
        <a onclick="loadPage('tintuc.html', this)" class="mobile-nav-item"><i class="bi bi-newspaper"></i> Tin</a>
        <a onclick="loadPage('diadiem.html', this)" class="mobile-nav-item"><i class="bi bi-geo-alt"></i> Điểm Đến</a>
        <a onclick="loadPage('luutru.html', this)" class="mobile-nav-item"><i class="bi bi-house-heart"></i> Lưu Trú</a>
        <a onclick="loadPage('lichtau.html', this)" class="mobile-nav-item"><i class="bi bi-ticket"></i> Tàu</a>
        <a onclick="loadPage('thoitiet.html', this)" class="mobile-nav-item"><i class="bi bi-cloud"></i> Tiết</a>
        <a onclick="loadPage('bando.html', this)" class="mobile-nav-item"><i class="bi bi-map"></i> Map</a>
    </div>

    <script>
        function loadPage(url, element) {
            document.getElementById('content-frame').src = url;
            document.querySelectorAll('a').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
            
            // Active cả menu trên và dưới
            if(element) {
                // Nếu click trực tiếp
                element.classList.add('active');
            } else {
                // Nếu reload trang
                let links = document.querySelectorAll(`a[onclick*="${url}"]`);
                links.forEach(l => l.classList.add('active'));
            }
        }
    </script>
</body>
</html>
