<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thông Tin Du Lịch Đảo Phú Quý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* MENU BÊN TRÁI (PC) */
        .sidebar {
            height: 100vh; width: 260px; position: fixed; top: 0; left: 0;
            background: linear-gradient(180deg, #0d6efd 0%, #0a58ca 100%);
            padding-top: 20px; color: white; z-index: 1000;
        }
        .sidebar-brand { text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 30px; }
        .sidebar a {
            padding: 15px 25px; text-decoration: none; font-size: 16px; color: rgba(255,255,255,0.8);
            display: flex; align-items: center; transition: 0.2s; cursor: pointer;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: rgba(255,255,255,0.2); color: #fff; border-left: 4px solid #ffc107;
        }
        .sidebar i { margin-right: 10px; font-size: 1.2rem; }

        /* KHUNG HIỂN THỊ NỘI DUNG */
        .main-content { margin-left: 260px; height: 100vh; background: white; }
        #content-frame { width: 100%; height: 100%; border: none; }

        /* MENU DƯỚI (MOBILE) */
        @media screen and (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; height: calc(100vh - 60px); }
            .mobile-nav {
                position: fixed; bottom: 0; width: 100%; height: 60px; background: #fff;
                border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000;
            }
            .mobile-nav-item { text-align: center; font-size: 11px; color: #666; text-decoration: none; width: 25%; }
            .mobile-nav-item i { font-size: 20px; display: block; }
            .mobile-nav-item.active { color: #0d6efd; font-weight: bold; }
        }
        @media screen and (min-width: 769px) { .mobile-nav { display: none; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="bi bi-geo-alt-fill"></i> PHÚ QUÝ TRAVEL</div>
        <a onclick="loadPage('gioithieu.html', this)" class="menu-link active"><i class="bi bi-house-door"></i> Trang Chủ</a>
        <a onclick="loadPage('bando.html', this)" class="menu-link"><i class="bi bi-map"></i> Bản Đồ Số</a>
        <a onclick="loadPage('lichtau.html', this)" class="menu-link"><i class="bi bi-ferry"></i> Lịch Tàu</a>
        <a onclick="loadPage('thoitiet.html', this)" class="menu-link"><i class="bi bi-cloud-sun"></i> Thời Tiết</a>
    </div>

    <div class="main-content">
        <iframe id="content-frame" src="gioithieu.html" name="content-frame"></iframe>
    </div>

    <div class="mobile-nav">
        <a onclick="loadPage('gioithieu.html', this)" class="mobile-nav-item active"><i class="bi bi-house-door"></i> Trang Chủ</a>
        <a onclick="loadPage('bando.html', this)" class="mobile-nav-item"><i class="bi bi-map"></i> Bản Đồ</a>
        <a onclick="loadPage('lichtau.html', this)" class="mobile-nav-item"><i class="bi bi-ferry"></i> Tàu</a>
        <a onclick="loadPage('thoitiet.html', this)" class="mobile-nav-item"><i class="bi bi-cloud-sun"></i> Thời Tiết</a>
    </div>

    <script>
        function loadPage(url, element) {
            document.getElementById('content-frame').src = url;
            // Xử lý active nút bấm
            document.querySelectorAll('a').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
            // Tìm các nút có cùng link để bôi đậm
            let links = document.querySelectorAll(`a[onclick*="${url}"]`);
            links.forEach(l => l.classList.add('active'));
        }
    </script>
</body>
</html>
