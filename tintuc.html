<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức Sự Kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: transparent; font-family: 'Segoe UI', sans-serif; color: white; }
        .feed-container { max-width: 700px; margin: 0 auto; padding: 20px; }
        
        /* GIAO DIỆN BÀI VIẾT KIỂU FACEBOOK */
        .news-post {
            background: rgba(10, 25, 45, 0.9); /* Nền tối đậm */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; margin-bottom: 30px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .post-header { padding: 15px; display: flex; align-items: center; }
        .post-avatar { width: 40px; height: 40px; background: #00d2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-weight: bold; color: #000; }
        .post-info h6 { margin: 0; color: #fff; font-weight: 700; }
        .post-info small { color: #81d4fa; font-size: 0.8rem; }
        
        .post-content { padding: 0 15px 15px 15px; color: #e0e0e0; font-size: 0.95rem; line-height: 1.5; }
        .post-image { width: 100%; height: auto; display: block; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .post-actions { padding: 10px 15px; display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.05); }
        .action-btn { background: transparent; border: none; color: #aaa; font-size: 0.9rem; transition: 0.2s; }
        .action-btn:hover { color: #00d2ff; }

        #loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div class="feed-container">
        <h3 class="text-center mb-4" style="text-shadow: 0 0 10px #00d2ff;">TIN TỨC & SỰ KIỆN</h3>

        <div id="loading">
            <div class="spinner-border text-info" role="status"></div>
        </div>

        <div id="news-feed"></div>
    </div>

    <script>
        // Link Sheet của bạn
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9474mrN1hYwKJv0Zglw2cje-7re85MXpagcr8BP0XKMXQp8gXEqSWDxojc54cSaFJzy5gu1n7fdhX/pub?gid=0&single=true&output=csv'; 
        const DEFAULT_IMG = 'https://upload.wikimedia.org/wikipedia/commons/e/e4/Bai_Nho_-_Ganh_Hang.jpg';

        document.addEventListener('DOMContentLoaded', function() {
            fetch(SHEET_URL).then(r => r.text()).then(t => renderFeed(parseCSV(t)));
        });

        function renderFeed(data) {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('news-feed');

            // Duyệt tất cả dòng (Bỏ dòng Banner nếu có)
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || !row[1]) continue;
                
                const loai = row[0].trim();
                if (loai.toUpperCase() === 'BANNER') continue; // Bỏ qua Banner

                const tieuDe = row[1];
                const noiDung = row[2];
                let anh = (row[3] && row[3].length > 5) ? row[3] : null; // Nếu không có ảnh thì null
                const thoiGian = row[5] || 'Vừa xong';

                const html = `
                <div class="news-post">
                    <div class="post-header">
                        <div class="post-avatar"><i class="bi bi-bell-fill"></i></div>
                        <div class="post-info">
                            <h6>Ban Quản Trị Đảo</h6>
                            <small>${thoiGian} • <span class="text-warning">#${loai}</span></small>
                        </div>
                    </div>
                    <div class="post-content">
                        <p class="mb-2 fw-bold text-white" style="font-size: 1.1rem">${tieuDe}</p>
                        <p class="mb-0">${noiDung}</p>
                    </div>
                    ${anh ? `<img src="${anh}" class="post-image">` : ''}
                    <div class="post-actions">
                        <button class="action-btn"><i class="bi bi-hand-thumbs-up"></i> Thích</button>
                        <button class="action-btn"><i class="bi bi-chat"></i> Bình luận</button>
                        <button class="action-btn"><i class="bi bi-share"></i> Chia sẻ</button>
                    </div>
                </div>`;
                container.insertAdjacentHTML('afterbegin', html);
            }
        }

        function parseCSV(str) {
            const arr = []; let quote = false; let row = 0, col = 0, c = 0;
            for (; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];        
                arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';   
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; ++c; continue; } 
                arr[row][col] += cc;
            }
            return arr;
        }
    </script>
</body>
</html>
