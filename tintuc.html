<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức Phú Quý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background: transparent; font-family: 'Segoe UI', sans-serif; color: white; padding: 10px; }

        /* --- 1. NEWS TICKER (Dòng tin chạy) --- */
        .news-ticker-wrap {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 50px; overflow: hidden; height: 40px; margin-bottom: 20px;
            display: flex; align-items: center; position: relative;
        }
        .ticker-label {
            background: #d50000; color: white; font-weight: bold; padding: 0 15px;
            height: 100%; display: flex; align-items: center; z-index: 2;
            text-transform: uppercase; font-size: 0.8rem; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        .ticker-content {
            white-space: nowrap; position: absolute; will-change: transform;
            animation: ticker 30s linear infinite; padding-left: 100%;
            color: #e0f7fa; font-size: 0.95rem;
        }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* --- 2. HERO SECTION (Tin nổi bật) --- */
        .hero-card {
            position: relative; border-radius: 15px; overflow: hidden;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .hero-card:hover { transform: scale(1.01); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: #00d2ff; }
        .hero-img { width: 100%; object-fit: cover; transition: 0.5s; }
        .hero-card:hover .hero-img { transform: scale(1.1); }
        
        .hero-big { height: 400px; } /* Ảnh to bên trái */
        .hero-small { height: 190px; } /* Ảnh nhỏ bên phải */

        .hero-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
            padding: 20px;
        }
        .hero-title { font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; margin-bottom: 5px; }
        .hero-big .hero-title { font-size: 1.5rem; text-transform: uppercase; }
        .hero-small .hero-title { font-size: 1rem; }
        .hero-meta { font-size: 0.8rem; color: #bbb; }

        /* --- 3. STANDARD GRID (Tin thường) --- */
        .info-card {
            background: linear-gradient(145deg, rgba(0, 40, 80, 0.7), rgba(0, 15, 30, 0.85));
            backdrop-filter: blur(15px); border: 1px solid rgba(0, 200, 255, 0.2); 
            border-radius: 15px; margin-bottom: 25px; overflow: hidden; height: 100%; 
            display: flex; flex-direction: column; transition: all 0.3s ease;
        }
        .info-card:hover { transform: translateY(-5px); border-color: #00d2ff; box-shadow: 0 10px 30px rgba(0, 100, 255, 0.3); }
        .card-img-top { height: 180px; width: 100%; object-fit: cover; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* ICON VIDEO PLAY */
        .video-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: rgba(255,255,255,0.8);
            text-shadow: 0 0 20px rgba(0,0,0,0.5); pointer-events: none;
            transition: 0.3s;
        }
        .hero-card:hover .video-icon, .info-card:hover .video-icon { color: #ff0000; transform: translate(-50%, -50%) scale(1.2); }

        /* MÀU SẮC CHUYÊN MỤC */
        .badge-cate { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-right: 5px; }
        .bg-ChinhTri { background: #d32f2f; } /* Đỏ đậm */
        .bg-VanHoa { background: #7b1fa2; } /* Tím */
        .bg-XaHoi { background: #0288d1; } /* Xanh dương */
        .bg-GiaoDuc { background: #388e3c; } /* Xanh lá */
        .bg-Default { background: #616161; }

        .btn-read { margin-top: auto; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 20px; font-size: 0.8rem; padding: 5px 15px; width: fit-content; text-decoration: none; transition: 0.3s; }
        .btn-read:hover { background: #00d2ff; color: #000; border-color: #00d2ff; font-weight: bold; }

        #loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="d-flex justify-content-between align-items-end mb-3 mt-2">
            <h2 style="font-weight: 900; color: #00d2ff; text-transform: uppercase; margin: 0;">
                <i class="bi bi-newspaper"></i> TIN TỨC ĐỊA PHƯƠNG
            </h2>
            <span style="color: #aaa; font-size: 0.9rem;">Cập nhật từ Đảo Phú Quý</span>
        </div>

        <div class="news-ticker-wrap">
            <div class="ticker-label">MỚI NHẤT</div>
            <div class="ticker-content" id="ticker-text">Đang tải tin tức...</div>
        </div>

        <div id="loading">
            <div class="spinner-border text-info" role="status"></div>
            <p class="mt-2 text-white-50">Đang tòa soạn...</p>
        </div>

        <div class="row mb-4" id="hero-section" style="display: none;">
            <div class="col-lg-8 mb-3 mb-lg-0">
                <div id="hero-main"></div> </div>
            <div class="col-lg-4 d-flex flex-column justify-content-between" id="hero-sub">
                </div>
        </div>

        <h5 style="color: #00d2ff; border-left: 4px solid #00d2ff; padding-left: 10px; margin-bottom: 20px;">
            DÒNG SỰ KIỆN
        </h5>
        <div class="row" id="news-grid"></div>

    </div>

    <script>
        // --- CẤU HÌNH ---
        // Dán Link CSV Sheet "TINTUC" vào đây
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9474mrN1hYwKJv0Zglw2cje-7re85MXpagcr8BP0XKMXQp8gXEqSWDxojc54cSaFJzy5gu1n7fdhX/pub?gid=1781530474&single=true&output=csv'; 
        const DEFAULT_IMG = 'https://upload.wikimedia.org/wikipedia/commons/e/e4/Bai_Nho_-_Ganh_Hang.jpg';

        document.addEventListener('DOMContentLoaded', function() {
            fetch(SHEET_URL).then(r => r.text()).then(t => renderNews(parseCSV(t)));
        });

        function renderNews(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('hero-section').style.display = 'flex';
            
            // Bỏ tiêu đề, lấy dữ liệu thật
            // Cột: A=Loai, B=TieuDe, C=NoiDung, D=Anh, E=LinkBai, F=LinkVideo, G=Ngay
            let rows = data.slice(1).filter(r => r[1]);
            
            // (Tùy chọn) Sắp xếp theo ngày mới nhất nếu Sheet chưa sắp xếp
            // rows.reverse(); // Nếu muốn tin cuối sheet lên đầu

            // 1. XỬ LÝ TICKER (Lấy 5 tin mới nhất chạy chữ)
            const tickerTitles = rows.slice(0, 5).map(r => `<span class="mx-3">★ ${r[1]}</span>`).join('');
            document.getElementById('ticker-text').innerHTML = tickerTitles + tickerTitles; // Nhân đôi để chạy vòng lặp mượt

            // 2. PHÂN CHIA DỮ LIỆU (1 Tin Hot, 2 Tin Phụ, Còn lại Tin Thường)
            const mainNews = rows[0];
            const subNews = rows.slice(1, 3);
            const otherNews = rows.slice(3);

            // --- RENDER HERO MAIN (Tin to nhất) ---
            if (mainNews) {
                document.getElementById('hero-main').innerHTML = createHeroHTML(mainNews, 'hero-big');
            }

            // --- RENDER HERO SUB (2 Tin bên phải) ---
            let subHTML = '';
            subNews.forEach(news => {
                subHTML += createHeroHTML(news, 'hero-small mb-3');
            });
            document.getElementById('hero-sub').innerHTML = subHTML;

            // --- RENDER GRID (Tin còn lại) ---
            const grid = document.getElementById('news-grid');
            otherNews.forEach(news => {
                grid.insertAdjacentHTML('beforeend', createGridHTML(news));
            });
        }

        // Hàm tạo thẻ Hero (Tin nổi bật)
        function createHeroHTML(item, cssClass) {
            const loai = item[0] || 'Tin tức';
            const tieuDe = item[1];
            const anh = (item[3] && item[3].length > 5) ? item[3] : DEFAULT_IMG;
            const link = item[4] || '#';
            const video = item[5]; // Link video
            const ngay = item[6] || '';
            const badgeColor = getCateColor(loai);
            
            // Xử lý click: Nếu có video thì ưu tiên mở video
            const finalLink = video ? video : link;
            const iconPlay = video ? '<i class="bi bi-play-circle video-icon"></i>' : '';

            return `
            <a href="${finalLink}" target="_blank" class="hero-card ${cssClass} d-block text-decoration-none">
                <img src="${anh}" class="hero-img" style="height: 100%;">
                ${iconPlay}
                <div class="hero-overlay">
                    <span class="badge-cate ${badgeColor}">${loai}</span>
                    <span class="hero-meta"><i class="bi bi-clock"></i> ${ngay}</span>
                    <h3 class="hero-title mt-2 text-truncate">${tieuDe}</h3>
                </div>
            </a>`;
        }

        // Hàm tạo thẻ Grid (Tin thường)
        function createGridHTML(item) {
            const loai = item[0] || 'Tin tức';
            const tieuDe = item[1];
            const noiDung = item[2] || '';
            const anh = (item[3] && item[3].length > 5) ? item[3] : DEFAULT_IMG;
            const link = item[4] || '#';
            const video = item[5];
            const ngay = item[6] || '';
            const badgeColor = getCateColor(loai);
            
            const finalLink = video ? video : link;
            const btnText = video ? 'Xem Video <i class="bi bi-play-fill"></i>' : 'Đọc tiếp <i class="bi bi-arrow-right"></i>';
            const iconPlay = video ? '<i class="bi bi-play-circle video-icon" style="font-size: 2rem;"></i>' : '';

            return `
            <div class="col-md-4 col-sm-6">
                <div class="info-card">
                    <div style="position: relative; height: 180px; overflow: hidden;">
                        <img src="${anh}" class="card-img-top">
                        ${iconPlay}
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <span class="badge-cate ${badgeColor}">${loai}</span>
                            <small style="color: #aaa;">${ngay}</small>
                        </div>
                        <h5 style="font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 10px; line-height: 1.4;">${tieuDe}</h5>
                        <p style="font-size: 0.85rem; color: #e0f7fa; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 15px;">
                            ${noiDung}
                        </p>
                        <a href="${finalLink}" target="_blank" class="btn-read">${btnText}</a>
                    </div>
                </div>
            </div>`;
        }

        // Hàm lấy màu chuyên mục
        function getCateColor(loai) {
            if(!loai) return 'bg-Default';
            let l = loai.toLowerCase();
            if(l.includes('chính trị')) return 'bg-ChinhTri';
            if(l.includes('văn hóa')) return 'bg-VanHoa';
            if(l.includes('xã hội')) return 'bg-XaHoi';
            if(l.includes('giáo dục')) return 'bg-GiaoDuc';
            return 'bg-Default';
        }

        function parseCSV(str) {
            const arr = []; let quote = false; let row = 0, col = 0, c = 0;
            for (; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];        
                arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';   
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; ++c; continue; } 
                arr[row][col] += cc;
            }
            return arr;
        }
    </script>
</body>
</html>
