<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới Thiệu Đảo Phú Quý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: transparent; font-family: 'Segoe UI', sans-serif; color: white; padding: 20px; }
        .content-box {
            background: linear-gradient(145deg, rgba(0, 40, 80, 0.8), rgba(0, 15, 30, 0.9));
            backdrop-filter: blur(20px); border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 20px; padding: 40px; max-width: 900px; margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .main-title { color: #00d2ff; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; text-align: center; text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); font-size: 2.2rem; }
        .sub-title { color: #81d4fa; margin-top: 30px; margin-bottom: 15px; font-weight: 700; border-left: 4px solid #00d2ff; padding-left: 15px; font-size: 1.4rem; }
        .paragraph { line-height: 1.8; font-size: 1.1rem; color: #e0f7fa; text-align: justify; margin-bottom: 20px; white-space: pre-line; }
        .feature-img { width: 100%; border-radius: 15px; margin: 25px 0; border: 1px solid rgba(255,255,255,0.2); transition: transform 0.3s; }
        .feature-img:hover { transform: scale(1.02); }
        #loading { text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <div class="content-box">
        <div id="loading">
            <div class="spinner-border text-info" role="status"></div>
            <p class="mt-3 text-white-50">Đang tải dữ liệu...</p>
        </div>
        <div id="dynamic-content"></div>
    </div>

    <script>
        // --- QUAN TRỌNG: Dán Link CSV của Sheet "GIỚI THIỆU" vào đây ---
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9474mrN1hYwKJv0Zglw2cje-7re85MXpagcr8BP0XKMXQp8gXEqSWDxojc54cSaFJzy5gu1n7fdhX/pub?gid=1885034818&single=true&output=csv'; 

        document.addEventListener('DOMContentLoaded', function() {
            fetch(SHEET_URL).then(r => r.text()).then(t => renderAbout(parseCSV(t)));
        });

        function renderAbout(data) {
            const container = document.getElementById('dynamic-content');
            document.getElementById('loading').style.display = 'none';

            // Vì đã tách sheet riêng, ta lấy TOÀN BỘ dữ liệu trong sheet này
            // Bỏ dòng tiêu đề (index 0)
            
            let html = '';
            
            // Xử lý dòng dữ liệu đầu tiên (Dòng 2 trong Sheet) làm Tiêu đề chính
            if (data.length > 1) {
                const first = data[1];
                html += `
                    <h1 class="main-title">${first[1] || 'VỀ ĐẢO PHÚ QUÝ'}</h1>
                    <p class="paragraph">${first[2] || ''}</p>
                    ${(first[3] && first[3].length > 5) ? `<img src="${first[3]}" class="feature-img">` : ''}
                    <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">
                `;
            }

            // Xử lý các dòng còn lại làm mục con
            for (let i = 2; i < data.length; i++) {
                const row = data[i];
                if (!row || !row[1]) continue;
                html += `
                    <h3 class="sub-title">${row[1]}</h3>
                    <p class="paragraph">${row[2] || ''}</p>
                    ${(row[3] && row[3].length > 5) ? `<img src="${row[3]}" class="feature-img">` : ''}
                `;
            }
            container.innerHTML = html;
        }

        function parseCSV(str) {
            const arr = []; let quote = false; let row = 0, col = 0, c = 0;
            for (; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];        
                arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';   
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; ++c; continue; } 
                arr[row][col] += cc;
            }
            return arr;
        }
    </script>
</body>
</html>
