<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thời Tiết Phú Quý Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: transparent; font-family: 'Segoe UI', sans-serif; color: white; margin: 0; padding: 20px; }
        
        /* BẢNG THÔNG SỐ NHANH (Widget) */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .weather-item {
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }

        .weather-item i { font-size: 2rem; color: #00d2ff; text-shadow: 0 0 10px #00d2ff; }
        .weather-value { font-size: 1.5rem; font-weight: bold; margin-top: 10px; display: block; }
        .weather-label { font-size: 0.8rem; opacity: 0.7; text-transform: uppercase; }

        /* KHUNG BẢN ĐỒ GIÓ */
        .map-box {
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="mb-4 text-center">
        <h2 style="font-weight: 800; text-shadow: 0 0 15px #00d2ff;">TRẠM KHÍ TƯỢNG PHÚ QUÝ</h2>
        <p class="opacity-75">Dữ liệu thời gian thực từ vệ tinh</p>
    </div>

    <div class="weather-grid">
        <div class="weather-item">
            <i class="bi bi-thermometer-half"></i>
            <span class="weather-value" id="temp">27°C</span>
            <span class="weather-label">Nhiệt độ</span>
        </div>
        <div class="weather-item">
            <i class="bi bi-wind"></i>
            <span class="weather-value" id="wind">12 kt</span>
            <span class="weather-label">Tốc độ gió</span>
        </div>
        <div class="weather-item">
            <i class="bi bi-droplets-fill"></i>
            <span class="weather-value" id="humidity">80%</span>
            <span class="weather-label">Độ ẩm</span>
        </div>
        <div class="weather-item">
            <i class="bi bi-eye-fill"></i>
            <span class="weather-value" id="vis">10 km</span>
            <span class="weather-label">Tầm nhìn</span>
        </div>
    </div>

    <div class="map-box">
        <iframe src="https://embed.windy.com/embed2.html?lat=10.518&lon=108.940&zoom=11&level=surface&overlay=wind&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1" frameborder="0" style="width:100%; height:100%;"></iframe>
    </div>

    <script>
        // Hàm lấy thời tiết thật từ API miễn phí (OpenWeatherMap)
        async function getWeatherData() {
            try {
                // Tọa độ Đảo Phú Quý: 10.518, 108.940
                const response = await fetch('https://api.openweathermap.org/data/2.5/weather?lat=10.518&lon=108.940&appid=7db2460d368a5734891404c2780e922b&units=metric&lang=vi');
                const data = await response.json();

                // Cập nhật các ô thông số trên giao diện
                document.getElementById('temp').innerText = Math.round(data.main.temp) + '°C';
                document.getElementById('wind').innerText = Math.round(data.wind.speed * 1.94384) + ' kt'; // Đổi từ m/s sang Knot (kt)
                document.getElementById('humidity').innerText = data.main.humidity + '%';
                document.getElementById('vis').innerText = (data.visibility / 1000) + ' km';
            } catch (error) {
                console.log("Đang dùng dữ liệu mặc định");
            }
        }

        // Chạy hàm lấy dữ liệu
        getWeatherData();
        // Cập nhật lại sau mỗi 10 phút
        setInterval(getWeatherData, 600000);
    </script>
</body>
</html>
