<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Báo Thời Tiết - Glassmorphism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Nền trong suốt để ăn theo nền biển của trang chủ */
        body { background: transparent; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        
        /* Container chính */
        .weather-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Khung tiêu đề Glass */
        .weather-header {
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }

        .weather-title {
            margin: 0; font-weight: 800; font-size: 1.5rem; text-transform: uppercase;
            color: #fff; text-shadow: 0 0 10px #00d2ff;
        }

        /* Khung bản đồ Windy */
        .map-frame {
            flex-grow: 1; /* Chiếm hết không gian còn lại */
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Nút chuyển đổi nguồn dữ liệu */
        .btn-windfinder {
            background: linear-gradient(45deg, #ff9900, #ff5e00);
            border: none; color: white; font-weight: bold;
            padding: 10px 20px; border-radius: 30px;
            text-decoration: none; display: flex; align-items: center;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
            transition: 0.3s;
        }
        .btn-windfinder:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
            color: white;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        
        <div class="weather-header">
            <div class="d-flex align-items-center">
                <i class="bi bi-cloud-sun-fill me-3" style="font-size: 2rem; color: #ffc107;"></i>
                <div>
                    <h2 class="weather-title">Thời Tiết Biển</h2>
                    <small style="color: rgba(255,255,255,0.7)">Dữ liệu trực tiếp từ Windy & Windfinder</small>
                </div>
            </div>
            
            <a href="https://www.windfinder.com/forecast/phu_quy_island_lagoon" target="_blank" class="btn-windfinder">
                <i class="bi bi-box-arrow-up-right me-2"></i> Chi tiết Windfinder
            </a>
        </div>

        <div class="map-frame">
            <iframe 
                src="https://embed.windy.com/embed2.html?lat=10.530&lon=108.930&detailLat=10.530&detailLon=108.930&width=650&height=450&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1" 
                frameborder="0">
            </iframe>
        </div>

    </div>

</body>
</html>
