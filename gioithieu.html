<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - News Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Nền chung của trang web: Màu xám nhạt sang trọng */
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        
        /* --- THIẾT KẾ LẠI BANNER --- */
        .hero-banner {
            /* Dùng ảnh Vịnh Triều Dương làm nền */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('https://upload.wikimedia.org/wikipedia/commons/e/e4/Bai_Nho_-_Ganh_Hang.jpg');
            background-size: cover; 
            background-position: center;
            color: white; 
            padding: 80px 20px; /* Tăng độ cao để hoành tráng hơn */
            text-align: center; 
            border-radius: 0 0 30px 30px; /* Bo tròn góc dưới mềm mại */
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .hero-title {
            font-size: 2.5rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* --- THIẾT KẾ THẺ TIN (CARD) --- */
        .news-card {
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); /* Bóng mờ nhẹ */
            margin-bottom: 25px; 
            background: white; 
            overflow: hidden; /* Để ảnh không bị tràn ra ngoài góc bo */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Hiệu ứng khi di chuột vào thẻ tin */
        .news-card:hover { 
            transform: translateY(-5px); /* Nổi lên trên */
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); /* Bóng đậm hơn */
        }

        .news-header { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        .avatar { width: 45px; height: 45px; background: #0d6efd; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin-right: 12px; font-size: 1.2rem; }
        
        /* Ảnh tin tức */
        .news-img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border-bottom: 1px solid #eee;
        }
        
        .news-body { padding: 20px; }
        
        /* Các loại Tag màu sắc */
        .badge-custom { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .tag-CanhBao { background-color: #ffebee; color: #dc3545; }
        .tag-TinTuc { background-color: #e3f2fd; color: #0d6efd; }
        .tag-AmThuc { background-color: #e8f5e9; color: #198754; }
        .tag-CheckIn { background-color: #fff3e0; color: #fd7e14; }

        /* Loading */
        #loading { text-align: center; padding: 50px; color: #6c757d; }
    </style>
</head>
<body>

    <div class="hero-banner">
        <h1 class="hero-title">CHÀO MỪNG BẠN ĐẾN VỚI ĐẢO PHÚ QUÝ</h1>
        <p class="lead mt-2"><i class="bi bi-geo-alt-fill"></i> Đảo Phú Quý được được xếp hạng Top 10 Đông Nam Á về cảnh đẹp hoang sơ</p>
    </div>

    <div class="container">
        <div id="loading">
            <div class="spinner-grow text-primary" role="status"></div>
            <p class="mt-2">Đang tải tin tức...</p>
        </div>
        
        <div class="row" id="news-container">
            </div>
    </div>

    <script>
        // --- CẤU HÌNH ---
        // HÃY DÁN LẠI LINK GOOGLE SHEET CỦA BẠN VÀO ĐÂY
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9474mrN1hYwKJv0Zglw2cje-7re85MXpagcr8BP0XKMXQp8gXEqSWDxojc54cSaFJzy5gu1n7fdhX/pub?gid=0&single=true&output=csv'; 

        // Ảnh mặc định (Sẽ hiện ra nếu bạn quên điền link ảnh)
        const DEFAULT_IMG = 'https://media.vneconomy.vn/w800/images/upload/2023/04/27/dao-phu-quy-binh-thuan.jpg';

        document.addEventListener('DOMContentLoaded', function() {
            fetch(SHEET_URL)
                .then(response => response.text())
                .then(csvText => {
                    const rows = csvToArray(csvText);
                    renderNews(rows);
                })
                .catch(error => {
                    console.error('Lỗi:', error);
                });
        });

        function renderNews(data) {
            const container = document.getElementById('news-container');
            document.getElementById('loading').style.display = 'none';

            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row[1]) continue; 

                const loaiTin = row[0]; 
                const tieuDe = row[1];  
                const noiDung = row[2]; 
                let anh = row[3];     
                const link = row[4];    
                const thoiGian = row[5] ? row[5] : "Vừa xong"; 

                // --- XỬ LÝ ẢNH THÔNG MINH ---
                // Nếu cột ảnh trống HOẶC chứa chữ linh tinh như "(Link ảnh...)" -> Dùng ảnh mặc định
                if (!anh || anh.includes('(') || anh.length < 10) {
                    anh = DEFAULT_IMG;
                }

                // Chọn icon
                let icon = 'bi-info-circle';
                if(loaiTin == 'CanhBao') icon = 'bi-megaphone-fill';
                if(loaiTin == 'AmThuc') icon = 'bi-cup-hot-fill';
                if(loaiTin == 'CheckIn') icon = 'bi-camera-fill';

                const html = `
                <div class="col-md-4 col-sm-6">
                    <div class="news-card">
                        <div class="news-header">
                            <div class="avatar"><i class="bi ${icon}"></i></div>
                            <div>
                                <div class="fw-bold">Admin Phú Quý</div>
                                <small class="text-muted" style="font-size: 0.8rem"><i class="bi bi-clock"></i> ${thoiGian}</small>
                            </div>
                        </div>
                        
                        <img src="${anh}" class="news-img">
                        
                        <div class="news-body">
                            <span class="badge-custom tag-${loaiTin}">#${loaiTin}</span>
                            <h5 class="fw-bold mt-2 text-dark">${tieuDe}</h5>
                            <p class="text-secondary" style="font-size: 0.95rem">${noiDung}</p>
                            ${link && link !== '#' ? `<a href="${link}" class="btn btn-outline-primary w-100 mt-2 rounded-pill">Xem chi tiết <i class="bi bi-arrow-right"></i></a>` : ''}
                        </div>
                    </div>
                </div>
                `;
                container.insertAdjacentHTML('afterbegin', html);
            }
        }

        function csvToArray(str) {
            const rows = str.slice(str.indexOf("\n") + 1).split("\n");
            return rows.map(function (row) {
                const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                return row.split(regex).map(val => val.replace(/^"|"$/g, '').trim());
            });
        }
    </script>
</body>
</html>
